<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Penyewa Bilik Sek 7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F3EC;
    --surface: #FFFFFF;
    --ink: #2B2620;
    --ink-soft: #786C5C;
    --border: #E3DBCB;
    --clay: #8B5A3C;
    --paid: #4F7358;
    --paid-bg: #E5F1E8;
    --unpaid: #B24B36;
    --unpaid-bg: #FBE9E4;
    --info: #2E6A8E;
    --info-bg: #E4F0F6;
    --gold: #A67A1E;
    --gold-bg: #FBF1DC;
    --kerja: #3E5C8A;
    --kerja-bg: #E7EDF8;
    --student: #7A5A9E;
    --student-bg: #F1E9F7;
  }
  * { box-sizing: border-box; }
  body { margin:0; background: var(--bg); color: var(--ink); font-family:'Inter',sans-serif; padding: 28px 20px 60px; }
  .wrap { max-width: 960px; margin: 0 auto; }
  header { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; margin-bottom:24px; flex-wrap:wrap; }
  h1 { font-family:'Fraunces',serif; font-weight:500; font-size:28px; margin:0 0 4px; letter-spacing:-0.01em; }
  .subtitle { color: var(--ink-soft); font-size:14px; margin:0; }
  .btn-add { background: var(--ink); color: var(--bg); border:none; padding:11px 18px; border-radius:8px; font-size:14px; font-weight:500; font-family:'Inter',sans-serif; cursor:pointer; }
  .btn-add:hover { background:#423b30; }
  .btn-backup { background:var(--surface); color:var(--ink-soft); border:1px solid var(--border); padding:10px 16px; border-radius:8px; font-size:13px; font-family:'Inter',sans-serif; cursor:pointer; }
  .btn-backup:hover { background:var(--bg); }
  .header-actions { display:flex; gap:8px; flex-wrap:wrap; }
  .month-row { display:flex; align-items:center; gap:10px; margin-bottom:18px; flex-wrap:wrap; }
  .month-row label { font-size:13px; color:var(--ink-soft); }
  .month-select { background:var(--surface); border:1px solid var(--border); color:var(--ink); padding:8px 12px; border-radius:8px; font-size:14px; font-family:'Inter',sans-serif; cursor:pointer; }
  .month-select:focus { outline:2px solid var(--clay); outline-offset:-1px; }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:22px; }
  .stat { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px; }
  .stat .label { font-size:12.5px; color:var(--ink-soft); margin-bottom:6px; }
  .stat .value { font-family:'Fraunces',serif; font-size:24px; font-weight:500; }
  .stat.info { background:var(--info-bg); border-color:transparent; }
  .stat.info .label, .stat.info .value { color:var(--info); }
  .stat.success { background:var(--paid-bg); border-color:transparent; }
  .stat.success .label, .stat.success .value { color:var(--paid); }
  .stat.gold { background:var(--gold-bg); border-color:transparent; }
  .stat.gold .label, .stat.gold .value { color:var(--gold); }
  .stat.unpaid { background:var(--unpaid-bg); border-color:transparent; }
  .stat.
